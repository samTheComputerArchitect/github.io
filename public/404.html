<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var p = window.location.pathname + window.location.search + window.location.hash;
        if (p && p !== '/github.io/') sessionStorage.setItem('gh-pages-redirect', p);
        window.location.replace('/github.io/');
      })();
    </script>
  </head>
  <body></body>
</html>
