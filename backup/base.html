<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="page-title">NiyovAI</title>
    
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-canvas: #1D1E22; --bg-surface: #2B2C33; --bg-muted: #36373E;
            --border-subtle: #3A3B43; --text-primary: #FFFFFF; --text-secondary: #C6C7CE;
            --accent-default: #3B82F6; --accent-hover: #2563EB;
            --topbar-h: 64px; --font-ui: "Inter", sans-serif;
        }
        body { font-family: var(--font-ui); background: var(--bg-canvas); color: var(--text-primary); min-height: 100dvh; }
        a { color: inherit; text-decoration: none; }

        .topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
            height: var(--topbar-h); padding: 0 24px;
            background: rgba(43, 44, 51, 0.65); backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(58, 59, 67, 0.4);
        }
        .topbar__brand { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; flex: 1; }
        .brand-dot { width: 8px; height: 8px; background: var(--accent-default); border-radius: 9999px; }
        .topbar__nav {
            display: inline-flex; align-items: center; gap: 4px; background: rgba(30, 31, 36, 0.4);
            padding: 4px; border-radius: 8px; border: 1px solid rgba(58, 59, 67, 0.3);
            position: absolute; left: 50%; transform: translateX(-50%);
        }
        .topbar__link { height: 34px; padding: 0 16px; border-radius: 6px; color: var(--text-secondary); display: inline-flex; align-items: center; font-weight: 500; font-size: 13px; }
        .topbar__link.is-active, .topbar__link:hover { color: var(--text-primary); background: var(--bg-muted); }
        .topbar__actions { display: flex; justify-content: flex-end; flex: 1; }
        .btn-nav-cta { height: 38px; padding: 0 16px; background: var(--accent-default); color: #fff; border-radius: 6px; display: inline-flex; align-items: center; font-size: 13px; font-weight: 500; }
        
        .main-content { padding: 0; max-width: 100%; margin: 0 auto; }
    </style>
</head>
<body>

    <header class="topbar" id="glassNav">
        <a href="home.html" class="topbar__brand"><span class="brand-dot"></span>NiyovAI</a>
        <nav class="topbar__nav">
            <a href="home.html" class="topbar__link is-active">Home</a>
            <a href="about.html" class="topbar__link">About Us</a>
            <a href="products.html" class="topbar__link">Products</a>
            <a href="pricing.html" class="topbar__link">Pricing</a>
        </nav>
        <div class="topbar__actions">
            <a href="buy.html" class="btn-nav-cta">Get Started</a>
        </div>
    </header>

    <main class="main-content" id="app-view">
        Loading...
    </main>

    <script>
        // Automatically injects page content if this is loaded as a template wrapper, 
        // or falls back cleanly.
    </script>
</body>
</html>
